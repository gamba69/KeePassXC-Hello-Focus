name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release tag and license
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH: '$env:RELEASE_TAG'."
          }
          if (-not (Test-Path -LiteralPath 'LICENSE' -PathType Leaf)) {
            throw 'The MIT LICENSE file is required for a public release.'
          }
      - name: Compile and package published release (latest stable AutoIt)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: .\scripts\Build.ps1 -Package -Tag "$env:RELEASE_TAG"
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: .build/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Attach ZIP to existing GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = ".\dist\KeePassXCHelloFocus-$version.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Expected versioned release archive not found: $archive"
          }
          gh release upload "$env:RELEASE_TAG" "$archive"
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release asset upload failed ($LASTEXITCODE)." }
