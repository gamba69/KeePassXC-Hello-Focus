name: Release

# Immutable releases must receive every asset while still drafts.
# Publishing is deliberately a manual GitHub UI action, never a workflow trigger.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Draft Release tag (for example, 0.1.1 or v0.1.1)'
        type: string
        required: true

permissions:
  contents: write

# Do not upload from two simultaneous runs to the same draft.
concurrency:
  group: release-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate version, license, and Draft Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?(\d+\.\d+\.\d+)$') {
            throw "Release tag must match MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH: '$env:RELEASE_TAG'."
          }
          $version = $Matches[1]
          "VERSION=$version" >> $env:GITHUB_ENV
          if (-not (Test-Path -LiteralPath 'LICENSE' -PathType Leaf)) {
            throw 'The MIT LICENSE file is required for a public release.'
          }
          $draft = gh release view "$env:RELEASE_TAG" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0) {
            throw "Draft Release '$env:RELEASE_TAG' was not found. Create and save a draft before running this workflow."
          }
          if ($draft.Trim() -ne 'true') {
            throw "Release '$env:RELEASE_TAG' is already published. Immutable releases cannot accept new assets. Create a new version and draft instead."
          }

      - name: Compile and package tagged source (latest stable AutoIt)
        shell: pwsh
        run: .\scripts\Build.ps1 -Package -Tag "v$env:VERSION"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: .build/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify SHA-256 and attach files to Draft Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = ".\dist\KeePassXCHelloFocus-$env:VERSION.zip"
          $checksum = "$archive.sha256"
          foreach ($file in @($archive, $checksum)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected release file not found: $file"
            }
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = "$hash  $([System.IO.Path]::GetFileName($archive))"
          $actualLine = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $checksum).Path).Trim()
          if ($actualLine -cne $expectedLine) { throw 'Release ZIP SHA-256 verification failed.' }

          # Check the release again immediately before uploading, in case its state changed.
          $draft = gh release view "$env:RELEASE_TAG" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $draft.Trim() -ne 'true') {
            throw "Release '$env:RELEASE_TAG' is no longer a draft. Files were not uploaded."
          }
          gh release upload "$env:RELEASE_TAG" "$archive" "$checksum" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Draft Release asset upload failed ($LASTEXITCODE)." }

          # Report success only if GitHub can see both uploaded assets.
          $assetsJson = gh release view "$env:RELEASE_TAG" --json assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded Release assets.' }
          $assetNames = @(($assetsJson | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          foreach ($file in @($archive, $checksum)) {
            $fileName = [System.IO.Path]::GetFileName($file)
            if ($fileName -cnotin $assetNames) { throw "Release asset is missing after upload: $fileName" }
          }
          "Draft Release '$env:RELEASE_TAG' has both validated assets. Review the draft and click Publish release manually." >> $env:GITHUB_STEP_SUMMARY
