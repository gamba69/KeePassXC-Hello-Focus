name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and package (download latest stable AutoIt)
        id: package
        shell: pwsh
        run: |
          .\scripts\Build.ps1 -Package
          $archives = @(Get-ChildItem -LiteralPath 'dist' -File -Filter 'KeePassXCHelloFocus-*.zip')
          if ($archives.Count -ne 1) { throw "Expected one versioned ZIP, found $($archives.Count)." }
          $checksum = "$($archives[0].FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw "Missing SHA-256 file: $checksum" }
          $hash = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = "$hash  $($archives[0].Name)"
          $actualLine = [System.IO.File]::ReadAllText($checksum).Trim()
          if ($actualLine -cne $expectedLine) { throw 'Release ZIP SHA-256 verification failed.' }
          "archive_file=$($archives[0].Name)" >> $env:GITHUB_OUTPUT
          "checksum_file=$($archives[0].Name).sha256" >> $env:GITHUB_OUTPUT
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: .build/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
      # archive: false supports one file per upload; publish two separate, directly downloadable artifacts.
      - name: Upload testable ZIP without an extra artifact archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.package.outputs.archive_file }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload matching SHA-256 checksum
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.package.outputs.checksum_file }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Explain where to download the build
        shell: pwsh
        run: |
          'Build completed. Download these two files from Actions > Build > run > Artifacts:' >> $env:GITHUB_STEP_SUMMARY
          '- `${{ steps.package.outputs.archive_file }}` (distribution ZIP)' >> $env:GITHUB_STEP_SUMMARY
          '- `${{ steps.package.outputs.checksum_file }}` (SHA-256 of that exact ZIP)' >> $env:GITHUB_STEP_SUMMARY
          'Both artifacts download directly, without an extra ZIP wrapper.' >> $env:GITHUB_STEP_SUMMARY
